---
url: https://github.com/jethome-iot/esphome/
arch:
- amd64
- aarch64
hassio_api: true
auth_api: true
host_network: true
ingress: true
ingress_port: 0
panel_icon: mdi:chip
uart: true
ports:
  6052/tcp: null
map:
- ssl:ro
- config:rw
discovery:
- esphome
schema:
  status_use_ping: bool?
  streamer_mode: bool?
  home_assistant_dashboard_integration: bool?
  default_compile_process_limit: int(1,)?
  ssl: bool?
  certfile: str?
  keyfile: str?
  leave_front_door_open: bool?
backup_exclude:
- '*/*/'
init: false
startup: services
name: JetHome ESPJHome Device Builder
version: 2025.7.5
slug: espjhome
description: Build your own smart home devices using JetHome ESPJHome fork, no programming experience
image: ghcr.io/jethome-iot/esphome-hassio





